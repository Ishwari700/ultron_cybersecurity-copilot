[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron"
version = "13.0.0"
description = "Ultron — Autonomous Local AI-Assisted Cybersecurity Research & Investigation Workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "tldextract>=5.1.2",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "cryptography>=42.0.0",
    "chromadb>=0.5.0",
    "numpy>=1.26.0",
    "filelock>=3.12.0",
    "packaging>=23.0",
    "pypdf>=4.0.0",
    "fonttools>=4.40.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = [
    "onnxruntime>=1.18.0",
    "tokenizers>=0.19.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "live_ollama: marks tests requiring a running local Ollama daemon and loaded models",
]
